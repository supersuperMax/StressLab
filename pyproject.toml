# Tool configuration only. The `stresslab` Python package is built by CMake (task 1.8).

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["python/tests", "extensions"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100
# The brand kit (with its generator script) is kept exactly as supplied.
extend-exclude = ["resources"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "FA"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "^/resources/"
