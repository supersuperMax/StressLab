# A module without code: translations, a shortcut and a menu item for commands of other modules.
[extension]
id = "test.l10n"
name = "Русский язык"
version = "1.0.0"
engine = ">=1.0 <2"

[[contributes.localization]]
language = "ru"
path = "ru.json"

[[contributes.keybindings]]
command = "base.hello"
key = "Mod+H"

[[contributes.menus]]
location = "solve"
command = "solver.run"
