name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# A new push to a PR cancels the previous run; adding a label starts a separate run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install -r python/requirements-dev.txt
      - name: clang-format
        run: git ls-files -z -- '*.h' '*.hpp' '*.cpp' | xargs -0 -r clang-format --dry-run --Werror
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check .

  # Core without Qt GUI and VTK: every PR and every push to main.
  core:
    if: github.event.action != 'labeled'
    uses: ./.github/workflows/build.yml
    with:
      kind: core

  # Everything including the Qt shell: push to main, manual run, or a PR labelled "ci:full".
  full:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:full') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci:full'))
    uses: ./.github/workflows/build.yml
    with:
      kind: full
